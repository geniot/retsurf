[browser]
home_page = "http://localhost:8123"
search_page = ""
user_agent = ""
persist_site_data = true
restore_tabs = false
max_tabs = 1
page_zoom = 1.0
page_theme = "light"

[experimental]
webgl2 = true
webgpu = true
offscreen_canvas = true
grid = true
columns = true
container_queries = true
fontface = true
intersection_observer = true
resize_observer = true
indexeddb = true
storage_manager = true
notification = true
async_clipboard = true
permissions = true

[game_mode]
input_map = "pad"

[display]
width = 1280
height = 720
scale = 1.0
use_gles = true
software_render = false
max_fps = 60
cursor_linger_ms = 1500
toolbar_position = "top"
toolbar_autohide = false
dark_last_row = false

[input]
deadzone = 0.25
cursor_speed = 600.0
scroll_speed = 1600.0
trigger_threshold = 0.5
osk_nav_threshold = 0.5
osk_nav_initial_delay_ms = 350
osk_nav_repeat_ms = 140
hold_ms = 400
cursor_mode = "mouse"
hint_badges = true
edge_scroll = true
pad_layout = "playstation"
swap_face_buttons = false
system_keyboard = true
haptics = true

[history]
enabled = false
max_entries = 25

[downloads]
dir = ""
extensions = [
    "zip",
    "7z",
    "rar",
    "gz",
    "tgz",
    "bz2",
    "xz",
    "zst",
    "iso",
    "img",
    "bin",
    "cue",
    "chd",
    "pbp",
    "apk",
    "ipk",
    "deb",
    "rpm",
    "exe",
    "dmg",
    "pdf",
    "nes",
    "sfc",
    "smc",
    "gba",
    "gbc",
    "gb",
    "nds",
    "n64",
    "z64",
    "v64",
    "smd",
    "gen",
    "32x",
    "sms",
    "gg",
    "pce",
    "ngp",
    "ngc",
    "ws",
    "wsc",
    "a26",
    "a78",
    "lnx",
    "vb",
    "rom",
]

[adblock]
enabled = false
lists = [
    "https://easylist.to/easylist/easylist.txt",
    "https://easylist.to/easylist/easyprivacy.txt",
]
update_days = 7

[performance]
memory_profile = "auto"
layout_threads = 0
worker_pool_max = 0
cpu_boost_on_load = false
http_disk_cache_mb = 0

[data_saving]
block_images = false
block_media = false
block_fonts = false
max_images_per_page = 0

[audio]
enabled = true
max_decode_seconds = 300

[video]
enabled = true

[osk]
layouts = [
    "en",
    "ru",
]
style = "grid"

[debug]
memory_overlay = false
memory_log = false
frame_timing = false
thread_cpu = false

[update]
channel = "release"
auto_check = false
